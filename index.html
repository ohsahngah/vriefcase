<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vriefcase</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/styles/base.css" />
    <link rel="stylesheet" href="./assets/styles/icons.css" />
    <link rel="stylesheet" href="./assets/styles/custom.css" />
    <script src="./assets/scripts/main.js" defer></script>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="content-wrapper">
        <!-- 로고 이미지 -->
        <img src="https://vriefcase.github.io/assets/images/logo.webp" alt="vriefcase logo" class="logo">
        
        <!-- 배지 태그 영역 -->
        <div class="badges">
            <img src="https://img.shields.io/node/v/vriefcase" alt="node">
            
            <a href="https://www.npmjs.org/package/vriefcase" target="_blank" rel="noopener noreferrer">
                <img src="https://img.shields.io/npm/v/vriefcase.svg" alt="npm version">
            </a>
            
            <a href="https://packagephobia.com/result?p=vriefcase" target="_blank" rel="noopener noreferrer">
                <img src="https://packagephobia.com/badge?p=vriefcase" alt="install size">
            </a>
            
            <a href="https://npm-stat.com/charts.html?package=vriefcase" target="_blank" rel="noopener noreferrer">
                <img src="https://img.shields.io/npm/dt/vriefcase.svg" alt="npm downloads">
            </a>
            
            <a href="https://github.com/ohsahngah/vriefcase/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">
                <img src="https://img.shields.io/npm/l/vriefcase.svg" alt="License">
            </a>
        </div>

        <!-- 터미널 효과 -->
        <div class="cli-container monospace">
            <span class="prompt">></span>
            <span id="typing-text"></span><span class="cursor"></span>
        </div>

        <!-- 버튼 및 라이선스 영역 -->
        <div class="action-group">
            <div class="button-container">
                <a href="mailto:vriefcase@gmail.com" class="cyber-btn monospace pointer">Get in Touch</a>
                <a href="https://github.com/ohsahngah/vriefcase#readme" class="cyber-btn monospace pointer">Read Me!</a>
                <a href="https://github.com/ohsahngah/vriefcase/pulls" class="cyber-btn monospace pointer">Pull Request</a>
            </div>

            <span class="license-info monospace">
                Copyright © <a href="https://vriefcase.github.io" target="_blank" rel="noopener noreferrer">Vriefcase</a>. Licensed under the
                <a href="https://vriefcase.github.io/license" target="_blank" rel="noopener noreferrer">MIT License</a>.
            </span>
        </div>
    </div>

</body>
</html>
